<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin | Ecom Growth Station</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="vendor/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/admin.css" rel="stylesheet">
</head>
<body class="admin-body">
<div class="scroll-progress" id="scrollProgress"></div>

<header class="admin-bar">
  <a href="index.html" class="nav-logo">EGS<small>Admin</small></a>
  <div class="admin-bar-right">
    <span id="adminUser" class="admin-user"></span>
    <button id="logoutBtn" class="btn-mini" type="button" hidden>Log out</button>
    <a href="index.html" class="btn-mini">View site</a>
  </div>
</header>

<main class="container admin-main">
  <div id="notConfigured" class="callout" hidden>
    Supabase is not configured yet. Open <code>js/config.js</code> and paste your Project URL and anon key (see <code>README.md</code>).
  </div>

  <!-- Login -->
  <section id="loginView" class="login-card" hidden>
    <p class="eyebrow">Admin Area</p>
    <h1 class="section-title" style="font-size:2.4rem;margin-bottom:1.6rem">Sign In</h1>
    <form id="loginForm" novalidate>
      <div class="mb-3"><input id="lEmail" type="email" class="form-control" placeholder="Admin email" autocomplete="username" required></div>
      <div class="mb-3"><input id="lPass" type="password" class="form-control" placeholder="Password" autocomplete="current-password" required></div>
      <button class="btn btn-glow" type="submit" id="loginBtn">Sign In</button>
      <span class="form-status" id="loginStatus"></span>
    </form>
  </section>

  <!-- Dashboard -->
  <section id="dashView" hidden>
    <div class="row g-3 mb-4" id="statRow">
      <div class="col-6 col-md-3"><div class="stat-tile"><strong id="stTotal">0</strong><span>Total</span></div></div>
      <div class="col-6 col-md-3"><div class="stat-tile"><strong id="stNew">0</strong><span>New</span></div></div>
      <div class="col-6 col-md-3"><div class="stat-tile"><strong id="stWeek">0</strong><span>Last 7 days</span></div></div>
      <div class="col-6 col-md-3"><div class="stat-tile"><strong id="stDone">0</strong><span>Closed</span></div></div>
    </div>

    <div class="toolbar">
      <input id="search" class="form-control" placeholder="Search name, email, message...">
      <select id="fType" class="form-control"><option value="">All forms</option><option value="hire">Hire us</option><option value="contact">Contact</option><option value="academy">Academy</option><option value="join">Join the team</option></select>
      <select id="fStatus" class="form-control"><option value="">Any status</option><option value="new">New</option><option value="contacted">Contacted</option><option value="closed">Closed</option></select>
      <button id="refreshBtn" class="btn-mini" type="button">Refresh</button>
      <button id="csvBtn" class="btn-mini" type="button">Export CSV</button>
    </div>
    <p id="listStatus" class="note" style="margin:.5rem 0 1rem"></p>

    <div class="table-wrap"><table class="admin-table">
      <thead><tr><th>Date</th><th>Type</th><th>Name</th><th>Contact</th><th>Service</th><th>Status</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </section>
</main>

<!-- Detail modal -->
<div class="modal fade" id="detailModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable"><div class="modal-content p-3">
    <div class="modal-header border-0"><div><div class="modal-cat" id="dType"></div><h5 class="modal-title" id="dName"></h5></div><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button></div>
    <div class="modal-body">
      <dl class="detail-list" id="dList"></dl>
      <div class="row g-3 mt-2">
        <div class="col-md-4"><label class="lbl">Status</label><select id="dStatus" class="form-control"><option value="new">New</option><option value="contacted">Contacted</option><option value="closed">Closed</option></select></div>
        <div class="col-md-8"><label class="lbl">Internal notes</label><textarea id="dNotes" rows="3" class="form-control" placeholder="Private notes (visitors never see these)"></textarea></div>
      </div>
    </div>
    <div class="modal-footer border-0 justify-content-between">
      <button class="btn-mini danger" id="dDelete" type="button">Delete</button>
      <div><a class="btn-mini" id="dMail" href="#">Email</a> <a class="btn-mini" id="dWa" href="#" target="_blank" rel="noopener">WhatsApp</a> <button class="btn btn-glow" id="dSave" type="button">Save</button></div>
    </div>
  </div></div>
</div>

<script src="vendor/bootstrap.bundle.min.js"></script>
<script src="vendor/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
